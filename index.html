<!doctype html><html lang="he" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#101827"><title>Crypto AI Radar — אב טיפוס</title><style>body{background:#101827;color:#eef3fa;font:16px system-ui;margin:20px;max-width:700px;margin-inline:auto;padding:12px}article{background:#1c293b;border-radius:18px;padding:18px;margin:12px 0}button,select{background:#dbeafe;color:#102030;padding:12px;border:0;border-radius:10px;font:inherit}small{color:#aabbd0}h1{font-size:27px}svg{width:100%;height:90px}b{color:#9ed8ff}</style><h1>Crypto AI Radar</h1><p>אב טיפוס • ניתוח טכני ניסיוני • ללא מסחר אמיתי</p><button id="refresh">סרוק עכשיו</button> <select id="interval"><option>15m</option><option>1h</option><option>4h</option></select><p id="status" role="status">ממתין לנתונים</p><button id="install" hidden>התקן אפליקציה</button><main id="cards"></main><small>הנתונים מתעדכנים כל דקה כשהדף פעיל. אין חיזוי AI, התראות רקע או ביצוע עסקאות. אין להסתמך על האיתותים למסחר אמיתי.</small><script>
const symbols=['BTCUSDT','ETHUSDT','SOLUSDT'], root='https://data-api.binance.vision/api/v3/klines';let busy=false;const mean=a=>a.reduce((s,x)=>s+x,0)/a.length;function ema(a,n){return a.slice(n).reduce((v,x)=>v+(x-v)*2/(n+1),mean(a.slice(0,n)))}function rsi(a){let g=0,l=0;for(let i=1;i<=14;i++){let d=a[i]-a[i-1];g+=Math.max(d,0)/14;l+=Math.max(-d,0)/14}for(let i=15;i<a.length;i++){let d=a[i]-a[i-1];g=(13*g+Math.max(d,0))/14;l=(13*l+Math.max(-d,0))/14}return l===0?(g===0?50:100):100-100/(1+g/l)}const f=x=>x.toLocaleString('en-US',{maximumFractionDigits:4});async function scan(){if(busy)return;busy=true;const interval=document.querySelector('#interval').value;const status=document.querySelector('#status');status.textContent='סורק…';document.querySelector('#cards').innerHTML='';let ok=0;await Promise.all(symbols.map(async s=>{let el=document.createElement('article');document.querySelector('#cards').append(el);try{let res=await fetch(root+'?symbol='+s+'&interval='+interval+'&limit=150',{cache:'no-store',signal:AbortSignal.timeout(12000)});if(!res.ok)throw Error();let raw=await res.json();let rows=raw.filter(r=>r[6]<Date.now());if(rows.length<100)throw Error();let a=rows.map(r=>Number(r[4])),vol=rows.map(r=>Number(r[5]));if(!a.every(x=>Number.isFinite(x)&&x>0)||!vol.every(Number.isFinite))throw Error();let last=a.at(-1),e20=ema(a,20),e50=ema(a,50),r=rsi(a),ratio=vol.at(-1)/mean(vol.slice(-21,-1));if(!Number.isFinite(ratio)||!Number.isFinite(r))throw Error();let age=Date.now()-rows.at(-1)[6];let stale=age>({'15m':900000,'1h':3600000,'4h':14400000}[interval]+120000)||age<0;let signal=stale?'נתונים ישנים — אין איתות':e20>e50&&last>e20&&r>=50&&r<=70&&ratio>=1.2?'מועמד לכניסה מדומה':last<e50&&r<45?'מועמד ליציאה מדומה':'המתנה';let p=a.slice(-60),lo=Math.min(...p),hi=Math.max(...p);let pts=p.map((v,i)=>`${i*300/59},${85-75*(v-lo)/(hi-lo||1)}`).join(' ');el.innerHTML=`<h2 dir="ltr">${s}</h2><b dir="ltr">${f(last)} USDT</b><p>${signal}</p><svg viewBox="0 0 300 90"><polyline fill="none" stroke="#74c6ed" stroke-width="2" points="${pts}"/></svg><p dir="ltr">RSI ${r.toFixed(1)} · EMA20 ${f(e20)} · EMA50 ${f(e50)} · Vol ×${ratio.toFixed(2)}</p><small>נר סגור: ${new Date(rows.at(-1)[6]).toLocaleString('he-IL')} | ${interval}</small>`;if(!stale)ok++}catch{el.textContent=s+' — לא ניתן לקבל נתונים. אין איתות.'}}));status.textContent=`נתונים תקינים: ${ok}/3 | ${new Date().toLocaleTimeString('he-IL')}`;busy=false}document.querySelector('#refresh').onclick=scan;document.querySelector('#interval').onchange=scan;scan();setInterval(()=>{if(!document.hidden)scan()},60000);
let promptEvent;const install=document.querySelector('#install');window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();promptEvent=e;install.hidden=false});install.onclick=async()=>{if(promptEvent){await promptEvent.prompt();promptEvent=null;install.hidden=true}};if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});document.addEventListener('visibilitychange',()=>{if(!document.hidden)scan()});
</script></html>

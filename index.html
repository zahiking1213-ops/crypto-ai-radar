<!doctype html><html lang="he" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#101827"><title>Crypto AI Radar — אב טיפוס</title><style>body{background:#101827;color:#eef3fa;font:16px system-ui;margin:20px;max-width:700px;margin-inline:auto;padding:12px}article{background:#1c293b;border-radius:18px;padding:18px;margin:12px 0}button,select{background:#dbeafe;color:#102030;padding:12px;border:0;border-radius:10px;font:inherit}small{color:#aabbd0}h1{font-size:27px}svg{width:100%;height:90px}b{color:#9ed8ff}</style><h1>Crypto AI Radar</h1><p>גרסה 0.3 • מסחר מדומה ידני • ללא AI מחובר</p><button id="refresh">סרוק עכשיו</button> <select id="interval"><option>15m</option><option>1h</option><option>4h</option></select><p id="status" role="status">ממתין לנתונים</p><button id="install" hidden>התקן אפליקציה</button><main id="cards"></main><article><h2>יומן מסחר מדומה</h2><p>כל עסקה: 100 USDT ועמלה מדומה 0.1% בכל צד. ביצוע לפי מחיר נר סגור, לא מחיר ביצוע אמיתי.</p><div id="ledger"></div><button id="export">ייצוא יומן</button></article><small>הנתונים מתעדכנים כל דקה כשהדף פעיל. אין חיזוי AI, התראות רקע או ביצוע עסקאות. אין להסתמך על האיתותים למסחר אמיתי.</small><script>
const symbols=['BTCUSDT','ETHUSDT','SOLUSDT'], root='https://data-api.binance.vision/api/v3/klines';let busy=false;let trades=[];try{trades=JSON.parse(localStorage.getItem('radar03')||'[]');if(!Array.isArray(trades))trades=[]}catch{};const quotes={};function render(){let closed=trades.filter(t=>t.exit),net=closed.reduce((a,t)=>a+t.pnl,0);document.querySelector('#ledger').textContent=`עסקאות סגורות: ${closed.length} | רווח/הפסד נטו: ${net.toFixed(2)} USDT | פתוחות: ${trades.length-closed.length}`;for(const t of trades.slice(-20).reverse()){let d=document.createElement('p');d.textContent=`${t.symbol} ${t.interval} | כניסה ${t.entry} | ${t.exit?'יציאה '+t.exit+' | נטו '+t.pnl.toFixed(2):'פתוחה'}`;document.querySelector('#ledger').append(d)}}function trade(s){let q=quotes[s];if(!q||Date.now()-q.checked>90000||document.querySelector('#interval').value!==q.interval)return;let t=trades.find(t=>t.symbol===s&&!t.exit);if(t){if(t.interval!==q.interval||q.time<=t.time)return;t.exit=q.price;t.exitTime=q.time;t.pnl=100*(q.price/t.entry-1)-0.1*(1+q.price/t.entry)}else{trades.push({symbol:s,interval:q.interval,entry:q.price,time:q.time,reason:q.signal})}try{localStorage.setItem('radar03',JSON.stringify(trades))}catch{alert('לא ניתן לשמור יומן במכשיר')}render();scan()}document.querySelector('#export').onclick=()=>{let u=URL.createObjectURL(new Blob([JSON.stringify(trades,null,2)],{type:'application/json'}));let a=document.createElement('a');a.href=u;a.download='radar-trades.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};render();const mean=a=>a.reduce((s,x)=>s+x,0)/a.length;function ema(a,n){return a.slice(n).reduce((v,x)=>v+(x-v)*2/(n+1),mean(a.slice(0,n)))}function rsi(a){let g=0,l=0;for(let i=1;i<=14;i++){let d=a[i]-a[i-1];g+=Math.max(d,0)/14;l+=Math.max(-d,0)/14}for(let i=15;i<a.length;i++){let d=a[i]-a[i-1];g=(13*g+Math.max(d,0))/14;l=(13*l+Math.max(-d,0))/14}return l===0?(g===0?50:100):100-100/(1+g/l)}const f=x=>x.toLocaleString('en-US',{maximumFractionDigits:4});async function scan(){if(busy)return;busy=true;for(const s of symbols)delete quotes[s];const interval=document.querySelector('#interval').value;const status=document.querySelector('#status');status.textContent='סורק…';document.querySelector('#cards').innerHTML='';let ok=0;await Promise.all(symbols.map(async s=>{let el=document.createElement('article');document.querySelector('#cards').append(el);try{let res=await fetch(root+'?symbol='+s+'&interval='+interval+'&limit=150',{cache:'no-store',signal:AbortSignal.timeout(12000)});if(!res.ok)throw Error();let raw=await res.json();let rows=raw.filter(r=>r[6]<Date.now());if(rows.length<100)throw Error();let a=rows.map(r=>Number(r[4])),vol=rows.map(r=>Number(r[5]));if(!a.every(x=>Number.isFinite(x)&&x>0)||!vol.every(Number.isFinite))throw Error();let last=a.at(-1),e20=ema(a,20),e50=ema(a,50),r=rsi(a),ratio=vol.at(-1)/mean(vol.slice(-21,-1));if(!Number.isFinite(ratio)||!Number.isFinite(r))throw Error();let age=Date.now()-rows.at(-1)[6];let stale=age>({'15m':900000,'1h':3600000,'4h':14400000}[interval]+120000)||age<0;let signal=stale?'נתונים ישנים — אין איתות':e20>e50&&last>e20&&r>=50&&r<=70&&ratio>=1.2?'מועמד לכניסה מדומה':last<e50&&r<45?'מועמד ליציאה מדומה':'המתנה';let p=a.slice(-60),lo=Math.min(...p),hi=Math.max(...p);let pts=p.map((v,i)=>`${i*300/59},${85-75*(v-lo)/(hi-lo||1)}`).join(' ');el.innerHTML=`<h2 dir="ltr">${s}</h2><b dir="ltr">${f(last)} USDT</b><p>${signal}</p><svg viewBox="0 0 300 90"><polyline fill="none" stroke="#74c6ed" stroke-width="2" points="${pts}"/></svg><p dir="ltr">RSI ${r.toFixed(1)} · EMA20 ${f(e20)} · EMA50 ${f(e50)} · Vol ×${ratio.toFixed(2)}</p><small>נר סגור: ${new Date(rows.at(-1)[6]).toLocaleString('he-IL')} | ${interval}</small>`;if(!stale){ok++;quotes[s]={price:last,time:rows.at(-1)[6],interval,checked:Date.now(),signal};let reason=document.createElement('p');reason.textContent=signal==='מועמד לכניסה מדומה'?'הסבר: מגמה חיובית, RSI בטווח ונפח מוגבר.':signal==='מועמד ליציאה מדומה'?'הסבר: מחיר מתחת לממוצע 50 ו-RSI נמוך.':'הסבר: תנאי האיתות לא התקיימו יחד.';el.append(reason);let t=trades.find(t=>t.symbol===s&&!t.exit);let btn=document.createElement('button');btn.textContent=t?'סגור עסקה מדומה':'פתח עסקה מדומה';btn.disabled=!!t&&(t.interval!==interval||rows.at(-1)[6]<=t.time);btn.onclick=()=>trade(s);el.append(btn)}}catch{el.textContent=s+' — לא ניתן לקבל נתונים. אין איתות.'}}));status.textContent=`נתונים תקינים: ${ok}/3 | ${new Date().toLocaleTimeString('he-IL')}`;busy=false}document.querySelector('#refresh').onclick=scan;document.querySelector('#interval').onchange=scan;scan();setInterval(()=>{if(!document.hidden)scan()},60000);
let promptEvent;const install=document.querySelector('#install');window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();promptEvent=e;install.hidden=false});install.onclick=async()=>{if(promptEvent){await promptEvent.prompt();promptEvent=null;install.hidden=true}};if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});document.addEventListener('visibilitychange',()=>{if(!document.hidden)scan()});
</script></html>
